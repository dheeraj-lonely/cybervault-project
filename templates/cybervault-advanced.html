<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberVault Investigation Platform - Advanced 3D Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0a0f1c 0%, #1a2332 50%, #0a0f1c 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        .game-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }
        
        .overlay-panel {
            pointer-events: auto;
            background: rgba(0, 20, 40, 0.9);
            border: 1px solid #00ffff;
            border-radius: 8px;
            padding: 15px;
            color: #00ffff;
            font-family: 'Courier New', monospace;
            backdrop-filter: blur(5px);
        }
        
        .campaign-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
        }
        
        .streak-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            text-align: center;
            transform: scale(0);
            transition: transform 0.3s ease;
        }
        
        .streak-indicator.active {
            transform: scale(1);
        }
        
        .evidence-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 250px;
            max-height: 40vh;
            overflow-y: auto;
        }
        
        .ai-terminal-access {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(45deg, #ff6b35, #f7931e);
            border: none;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        
        .ai-terminal-access:hover {
            background: linear-gradient(45deg, #ff8555, #ff9931e);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.4);
        }
        
        .objective-list {
            margin-top: 10px;
        }
        
        .objective-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 0.9em;
        }
        
        .objective-checkbox {
            width: 15px;
            height: 15px;
            border: 2px solid #00ffff;
            border-radius: 3px;
            margin-right: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .objective-checkbox.completed {
            background: #00ffff;
            color: #000;
        }
        
        .evidence-item {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
            border-radius: 4px;
            padding: 8px;
            margin: 5px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .evidence-item:hover {
            border-color: #00ff66;
            background: rgba(0, 100, 0, 0.3);
        }
        
        .evidence-item.collected {
            border-color: #00ff66;
            background: rgba(0, 150, 0, 0.4);
        }
        
        .timer-display {
            font-size: 1.2em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .level-progress {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 8px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00ffff);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        .notification-system {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            z-index: 200;
        }
        
        .notification {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ffff;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
            text-align: center;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0f1c 0%, #1a2332 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 255, 255, 0.3);
            border-top: 3px solid #00ffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loading-spinner"></div>
        <h2>Initializing CyberVault Investigation Platform</h2>
        <p>Loading advanced forensic systems...</p>
    </div>

    <div id="canvas-container"></div>
    
    <div class="game-overlay">
        <!-- Campaign HUD -->
        <div class="campaign-hud overlay-panel">
            <h3 id="level-title">Level 1: The First Breach</h3>
            <div class="timer-display" id="timer">60:00</div>
            <div class="level-progress">
                <div class="progress-fill" id="level-progress"></div>
            </div>
            
            <div class="objective-list">
                <h4>Objectives:</h4>
                <div class="objective-item">
                    <div class="objective-checkbox" id="obj-1"></div>
                    <span>Examine the crime scene</span>
                </div>
                <div class="objective-item">
                    <div class="objective-checkbox" id="obj-2"></div>
                    <span>Collect digital evidence</span>
                </div>
                <div class="objective-item">
                    <div class="objective-checkbox" id="obj-3"></div>
                    <span>Interview the AI suspect</span>
                </div>
                <div class="objective-item">
                    <div class="objective-checkbox" id="obj-4"></div>
                    <span>Reconstruct the timeline</span>
                </div>
            </div>
            
            <div style="margin-top: 15px;">
                <div>Score: <span id="current-score">0</span></div>
                <div>Evidence: <span id="evidence-count">0</span>/12</div>
            </div>
        </div>
        
        <!-- Streak Indicator -->
        <div class="streak-indicator overlay-panel" id="streak-indicator">
            <div style="font-size: 0.8em; margin-bottom: 5px;">STREAK</div>
            <div style="font-size: 2em; font-weight: bold;" id="streak-count">0</div>
            <div style="font-size: 0.9em;" id="streak-multiplier">x1.0</div>
        </div>
        
        <!-- Evidence Panel -->
        <div class="evidence-panel overlay-panel">
            <h4>📁 Evidence Collected</h4>
            <div id="evidence-list">
                <!-- Evidence items will be populated dynamically -->
            </div>
        </div>
        
        <!-- AI Terminal Access Button -->
        <button class="ai-terminal-access" onclick="openAITerminal()">
            🧠 AI Interrogation Terminal
        </button>
        
        <!-- Notification System -->
        <div class="notification-system" id="notifications"></div>
    </div>

    <!-- Scripts -->
    <script type="module" src="{{ url_for('static', filename='js/cybervault-3d.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cybervault-advanced.js') }}"></script>
    <script src="{{ url_for('static', filename='js/campaign-system.js') }}"></script>
    
    <script>
        let gameEngine = null;
        let campaignSystem = null;
        
        // Initialize the game
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Hide loading screen after a brief delay
                setTimeout(() => {
                    const loadingScreen = document.getElementById('loading-screen');
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.style.display = 'none';
                    }, 500);
                }, 2000);
                
                // Initialize game systems
                await initializeGameSystems();
                
                console.log('🎮 CyberVault Advanced Game Initialized');
                
            } catch (error) {
                console.error('Game initialization failed:', error);
                showNotification('Game initialization failed. Please refresh the page.', 'error');
            }
        });
        
        async function initializeGameSystems() {
            // Wait for campaign system to be ready
            if (typeof CampaignSystem !== 'undefined') {
                campaignSystem = new CampaignSystem();
            }
            
            // Initialize 3D environment
            if (typeof CyberVault3D !== 'undefined') {
                gameEngine = new CyberVault3D();
            }
            
            // Setup game event listeners
            setupGameEventListeners();
        }
        
        function setupGameEventListeners() {
            // Evidence collection events
            document.addEventListener('evidenceCollected', (event) => {
                const { evidenceId, evidenceName } = event.detail;
                addEvidenceToPanel(evidenceId, evidenceName);
                updateEvidenceCount();
                
                if (campaignSystem) {
                    campaignSystem.progressTracker.collectEvidence(evidenceId);
                }
            });
            
            // Objective completion events
            document.addEventListener('objectiveComplete', (event) => {
                const { objectiveId } = event.detail;
                completeObjective(objectiveId);
                
                if (campaignSystem) {
                    campaignSystem.completeObjective(objectiveId);
                }
            });
            
            // Streak events
            document.addEventListener('streakUpdate', (event) => {
                const { streak, multiplier } = event.detail;
                updateStreakDisplay(streak, multiplier);
            });
        }
        
        function addEvidenceToPanel(evidenceId, evidenceName) {
            const evidenceList = document.getElementById('evidence-list');
            const evidenceItem = document.createElement('div');
            evidenceItem.className = 'evidence-item collected';
            evidenceItem.innerHTML = `
                <strong>${evidenceName}</strong><br>
                <small>Evidence ID: ${evidenceId}</small>
            `;
            evidenceList.appendChild(evidenceItem);
        }
        
        function updateEvidenceCount() {
            const evidenceItems = document.querySelectorAll('.evidence-item.collected');
            document.getElementById('evidence-count').textContent = evidenceItems.length;
        }
        
        function completeObjective(objectiveIndex) {
            const checkbox = document.getElementById(`obj-${objectiveIndex + 1}`);
            if (checkbox) {
                checkbox.classList.add('completed');
                checkbox.textContent = '✓';
            }
            
            updateLevelProgress();
            showNotification('Objective Complete!', 'success');
        }
        
        function updateLevelProgress() {
            const completedObjectives = document.querySelectorAll('.objective-checkbox.completed');
            const totalObjectives = document.querySelectorAll('.objective-checkbox');
            const progress = (completedObjectives.length / totalObjectives.length) * 100;
            
            document.getElementById('level-progress').style.width = `${progress}%`;
        }
        
        function updateStreakDisplay(streak, multiplier) {
            const streakIndicator = document.getElementById('streak-indicator');
            const streakCount = document.getElementById('streak-count');
            const streakMultiplier = document.getElementById('streak-multiplier');
            
            streakCount.textContent = streak;
            streakMultiplier.textContent = `x${multiplier.toFixed(1)}`;
            
            if (streak > 0) {
                streakIndicator.classList.add('active');
            } else {
                streakIndicator.classList.remove('active');
            }
        }
        
        function showNotification(message, type = 'info') {
            const notifications = document.getElementById('notifications');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            
            notifications.appendChild(notification);
            
            // Auto-remove after 3 seconds
            setTimeout(() => {
                notification.style.opacity = '0';
                setTimeout(() => {
                    notifications.removeChild(notification);
                }, 300);
            }, 3000);
        }
        
        function openAITerminal() {
            window.open('/ai-terminal', '_blank', 'width=1200,height=800');
        }
        
        // Timer functionality
        let gameTimer = null;
        let timeRemaining = 3600; // 60 minutes
        
        function startTimer(duration) {
            timeRemaining = duration;
            gameTimer = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    clearInterval(gameTimer);
                    handleTimeUp();
                }
            }, 1000);
        }
        
        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            document.getElementById('timer').textContent = display;
            
            // Change color as time runs low
            const timerElement = document.getElementById('timer');
            if (timeRemaining < 300) { // Last 5 minutes
                timerElement.style.color = '#ff0000';
            } else if (timeRemaining < 600) { // Last 10 minutes
                timerElement.style.color = '#ffaa00';
            } else {
                timerElement.style.color = '#00ffff';
            }
        }
        
        function handleTimeUp() {
            showNotification('Time\'s up! Level failed.', 'error');
            // Handle game over logic
        }
        
        // Start the timer when page loads
        setTimeout(() => {
            startTimer(3600); // 60 minutes for level 1
        }, 2000);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            if (gameEngine && gameEngine.renderer) {
                gameEngine.camera.aspect = window.innerWidth / window.innerHeight;
                gameEngine.camera.updateProjectionMatrix();
                gameEngine.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
