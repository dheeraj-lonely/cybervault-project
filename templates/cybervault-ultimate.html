/* ═══════════════════════════════════════════════════════════
   AUDIO ENGINE
═══════════════════════════════════════════════════════════ */
const A = {
  ctx: null,
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this._drone();
  },
  _tone(freq, type, dur, vol = 0.09, delay = 0) {
    if (!this.ctx) return;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    const t = this.ctx.currentTime + delay;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur);
  },
  click()    { this._tone(800,'sine',.05,.04); },
  uv()       { this._tone(1200,'triangle',.14,.07); this._tone(900,'triangle',.14,.05,.06); },
  clue()     { [523,659,784].forEach((f,i)=>this._tone(f,'sine',.18,.1,i*.1)); },
  beep()     { this._tone(1000,'square',.07,.03); },
  errBeep()  { this._tone(220,'sawtooth',.12,.06); },
  unlock()   { [400,600,900].forEach((f,i)=>this._tone(f,'sine',.25,.12,i*.12)); },
  pickup()   { this._tone(1400,'sine',.08,.06); this._tone(1800,'sine',.08,.05,.07); },
  _drone() {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    const f = this.ctx.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.value = 55;
    f.type = 'lowpass'; f.frequency.value = 110;
    g.gain.value = 0.018;
    o.connect(f); f.connect(g); g.connect(this.ctx.destination);
    o.start();
  }
};

(function boot() {
  const container = document.getElementById('cv');
  scene    = new THREE.Scene();
  camera   = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 120);
  camera.position.set(0,1.7,5.5);

  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type    = THREE.PCFSoftShadowMap;
  renderer.toneMapping       = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  container.appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.05;
  controls.maxPolarAngle = Math.PI/2 - 0.01;
  controls.minDistance = 1.2; controls.maxDistance = 10;

/* ═══════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════ */
function m(opts)    { return new THREE.MeshStandardMaterial(opts); }
function bm(opts)   { return new THREE.MeshBasicMaterial(opts); }
function add(geo,mat,px,py,pz,rx,ry,rz){
  const mesh=new THREE.Mesh(geo,mat);
  if(px!==undefined) mesh.position.set(px,py,pz);
  if(rx!==undefined) mesh.rotation.set(rx,ry,rz);
  mesh.castShadow=mesh.receiveShadow=true;
  scene.add(mesh); return mesh;
}
function addI(mesh,id){ mesh.userData.cid=id; iObjs.push(mesh); return mesh; }
function light(T,col,int,dist,x,y,z,shadows=false){
  const l=new T(col,int,dist); if(x!==undefined) l.position.set(x,y,z);
  if(shadows&&l.castShadow!==undefined){ l.castShadow=true; if(l.shadow) l.shadow.mapSize.set(512,512); }
  scene.add(l); return l;
}
function clrScene(){
  while(scene.children.length) scene.remove(scene.children[0]);
  iObjs=[];
}
function tileCanvas(col,lineCol,repeat=4){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const x=c.getContext('2d');
  x.fillStyle=col; x.fillRect(0,0,256,256);
  x.strokeStyle=lineCol; x.lineWidth=1.5;
  const s=256/repeat;
  for(let i=0;i<=repeat;i++){ x.beginPath(); x.moveTo(i*s,0); x.lineTo(i*s,256); x.stroke(); }
  for(let i=0;i<=repeat;i++){ x.beginPath(); x.moveTo(0,i*s); x.lineTo(256,i*s); x.stroke(); }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(repeat,repeat);
  return t;
}
function woodCanvas(){
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const x=c.getContext('2d');
  x.fillStyle='#3a2310'; x.fillRect(0,0,256,256);
  for(let i=0;i<30;i++){
    x.strokeStyle=`rgba(${80+Math.random()*40},${40+Math.random()*20},${10+Math.random()*15},.4)`;
    x.lineWidth=1+Math.random()*2;
    x.beginPath(); x.moveTo(0,i*9+Math.random()*4); x.lineTo(256,i*9+Math.random()*7); x.stroke();
  }
  return new THREE.CanvasTexture(c);
}
function stoneCanvas(){
  const c=document.createElement('canvas'); c.width=256; c.height=256;
  const x=c.getContext('2d');
  x.fillStyle='#1a1c1e'; x.fillRect(0,0,256,256);
  for(let i=0;i<200;i++){
    x.fillStyle=`rgba(${40+Math.random()*30},${40+Math.random()*30},${42+Math.random()*30},.7)`;
    x.fillRect(Math.random()*256,Math.random()*256,2+Math.random()*6,2+Math.random()*6);
  }
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(3,3); return t;
}

/* ═══════════════════════════════════════════════════════════
   LEVEL LOADER
═══════════════════════════════════════════════════════════ */
function tryLevel(n){ if(n>hUnlk) return; loadLevel(n); }
function loadLevel(n){
  aLvl=n; clrScene();
  hideLCB();
  document.getElementById('htitle').innerText = LEVELS[n].title;
  const def=LEVELS[n];
  scene.background=new THREE.Color(def.bg);
  scene.fog=new THREE.FogExp2(def.fog[0],def.fog[1]);
  camera.position.set(...def.cam);
  controls.target.set(...def.tgt);
  scene.add(dust);
  for(let i=1;i<=7;i++){
    const b=document.getElementById('lb'+i);
    b.className='lb'+(i===n?' on':i>hUnlk?' lk':'');
  }
  scene.add(new THREE.AmbientLight(0x101520,.4));
  switch(n){
    case 1: buildVault();      break;
    case 2: buildCorridor();   break;
    case 3: buildKitchen();    break;
    case 4: buildLibrary();    break;
    case 5: buildRedRoom();    break;
    case 6: buildGallery();    break;
    case 7: buildBathroom();   break;
  }
  updateUI();
}
function advanceLevel(){ if(aLvl<7) loadLevel(aLvl+1); }

/* ═══════════════════════════════════════════════════════════
   INTERACTION
═══════════════════════════════════════════════════════════ */
function onKey(e){
  A.init();
  if(e.key==='f'||e.key==='F'){ toggleUV(); }
  else if(e.key==='Escape'){ closeInspect(); closeKeypad(); }
}
function onCvClick(){
  A.init(); A.click();
  if(!hObj) return;
  const cid=hObj.userData.cid;
  const clue=LEVELS[aLvl].clues[cid];
  if(!clue) return;
  if(clue.uvOnly && !uvMode) return; // must have UV on
  if(clue.isKeypad){ openKeypad(); return; }
  openInspect(cid);
}

function toggleUV(){
  uvMode=!uvMode; A.uv();
  document.getElementById('vig').className=uvMode?'uv':'';
  // show/hide UV meshes
  iObjs.forEach(o=>{
    const cid=o.userData.cid;
    const cl=LEVELS[aLvl].clues[cid];
    if(cl&&cl.uvOnly){
      o.material.opacity = uvMode ? .82 : .0;
    }
  });
  // dust colour shift
  dust.material.color.set(uvMode?0xcc00ff:0x88aacc);
  dust.material.opacity = uvMode?.55:.28;
  // xh hint
  document.getElementById('xh').style.borderColor = uvMode?'rgba(160,0,255,.8)':'rgba(255,255,255,.7)';
}

function openInspect(cid){
  const cl=LEVELS[aLvl].clues[cid];
  document.getElementById('ititle').innerText=cl.name;
  document.getElementById('itag').innerText=cl.tag;
  document.getElementById('idesc').innerText=cl.desc;
  document.getElementById('im').style.display='flex';
  if(!found[aLvl].has(cid)){
    found[aLvl].add(cid); A.clue();
    if(cl.item){ pickupItem(cl.item); }
    updateUI();
    if(found[aLvl].size===maxC) onLevelComplete();
  }
}
function closeInspect(){ document.getElementById('im').style.display='none'; }

function pickupItem(it){
  inventory.push(it); A.pickup();
  const idx=inventory.length-1;
  const slot=document.getElementById('s'+idx);
  if(slot){ slot.innerText=it.icon; slot.className='is on'; slot.title=it.label; }
}

function openKeypad(){
  kpBuf=''; updateKPD(); document.getElementById('kperr').innerText='';
  document.getElementById('km').style.display='flex'; kpActive=true;
}
function closeKeypad(){ document.getElementById('km').style.display='none'; kpActive=false; }
function kp(n){ if(kpBuf.length<4){ kpBuf+=n; A.beep(); updateKPD(); } }
function kpClr(){ kpBuf=''; A.beep(); updateKPD(); document.getElementById('kperr').innerText=''; }
function updateKPD(){ document.getElementById('kpd').innerText=(kpBuf+'_ _ _ _').slice(0,7).replace(/./g,(c,i)=>i<kpBuf.length?c:(i%2===0?'_':' ')); }
function kpSubmit(){
  const code=LEVELS[aLvl].code;
  if(!code){ closeKeypad(); return; }
  if(kpBuf===code){
    A.unlock(); closeKeypad();
    // mark keypad clue as found
    const cid=Object.keys(LEVELS[aLvl].clues).find(k=>LEVELS[aLvl].clues[k].isKeypad);
    if(cid&&!found[aLvl].has(cid)){
      found[aLvl].add(cid); updateUI();
      if(found[aLvl].size===maxC) onLevelComplete();
    } else if(cid&&found[aLvl].has(cid)){
      // already found — just advance
      if(aLvl<7){ hUnlk=Math.max(hUnlk,aLvl+1); loadLevel(aLvl+1); }
    }
  } else {
    A.errBeep();
    document.getElementById('kperr').innerText='✗ ACCESS DENIED';
    document.getElementById('kpd').innerText='ERROR';
    setTimeout(()=>{ kpBuf=''; updateKPD(); document.getElementById('kperr').innerText=''; },900);
  }
}

function onLevelComplete(){
  hUnlk=Math.max(hUnlk,aLvl+1);
  for(let i=1;i<=7;i++){
    const b=document.getElementById('lb'+i);
    if(i<=hUnlk) b.classList.remove('lk');
  }
  const nb=document.getElementById('nbtn');
  nb.style.display=aLvl<7?'block':'none';
  nb.innerText=aLvl<7?`ADVANCE TO LEVEL ${aLvl+1} →`:'🏆 INVESTIGATION COMPLETE';
  document.getElementById('lcb').classList.add('show');
}
function hideLCB(){ document.getElementById('lcb').classList.remove('show'); }

/* ═══════════════════════════════════════════════════════════
   UI UPDATE
═══════════════════════════════════════════════════════════ */
function updateUI(){
  const n=found[aLvl].size;
  document.getElementById('cc').innerText=`${n} / ${maxC}`;
  document.getElementById('pb').style.width=`${(n/maxC)*100}%`;
  const list=document.getElementById('evl');
  list.innerHTML='';
  if(n===0){ list.innerHTML='<div id="en" style="color:var(--muted);font-size:.73rem;">Examine objects or toggle UV [F] to reveal hidden clues…</div>'; return; }
  found[aLvl].forEach(cid=>{
    const cl=LEVELS[aLvl].clues[cid]; if(!cl) return;
    const d=document.createElement('div'); d.className='ei'+(cl.uvOnly?' uv':'');
    d.innerHTML=`<strong>${cl.name}</strong>${cl.desc.slice(0,88)}…`; list.appendChild(d);
  });
}

/* ═══════════════════════════════════════════════════════════
   RENDER LOOP
═══════════════════════════════════════════════════════════ */
let _t=0;
function loop(){
  requestAnimationFrame(loop); _t+=.016;
  controls.update();
  dust.rotation.y+=.0004;

  // candle flicker (L4)
  if(aLvl===4){
    scene.children.forEach(c=>{ if(c.isPointLight&&c.intensity<.5&&c.intensity>.1) c.intensity=.25+Math.sin(_t*5+c.position.x*3)*.12; });
  }
  // red flash (L5)
  if(aLvl===5){
    const rl=scene.children.find(c=>c.isPointLight&&c.color.r>.9&&c.intensity>1);
    if(rl) rl.intensity=1.4+Math.sin(_t*8)*.4+(Math.random()<.04?-.7:0);
  }

  // raycast from screen centre
  raycaster.setFromCamera(mouse,camera);
  const hits=raycaster.intersectObjects(iObjs);
  const xhEl=document.getElementById('xh');
  const prEl=document.getElementById('pr');

  if(hits.length>0){
    const obj=hits[0].object;
    const cid=obj.userData.cid;
    const cl=LEVELS[aLvl].clues[cid];
    const needsUV=cl&&cl.uvOnly&&!uvMode;
    if(needsUV){ hObj=null; xhEl.className=''; prEl.style.display='none'; }
    else {
      hObj=obj;
      xhEl.className=uvMode?'uv-hit':'hit';
      prEl.style.display='block';
      prEl.innerText=cl?.isKeypad?'[CLICK] KEYPAD':'[CLICK] '+cl?.name;
    }
  } else {
    hObj=null; xhEl.className=''; prEl.style.display='none';
  }

  renderer.render(scene,camera);
}
</script>
</body>
</html>
