<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CyberVault | Training Coach</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="brand-wrap">
      <span class="brand-mark">CV</span>
      <span class="brand-name">CYBERVAULT</span>
    </div>
    <nav class="main-nav">
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('game_page') }}">Game</a>
      <a href="#coach">Coach</a>
    </nav>
    <a class="primary-btn" href="{{ url_for('game_page') }}">Open Lab</a>
  </header>

  <main class="dashboard">
    <section id="coach" class="dashboard-card">
      <h1>Forensic Learning Coach</h1>
      <form id="learner-profile-form" class="profile-form">
        <input id="learner-name-input" type="text" value="Student" placeholder="Learner name">
        <select id="learner-level-select">
          <option value="beginner">Beginner</option>
          <option value="intermediate">Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
        <button type="submit" class="primary-btn">Save Profile</button>
      </form>
      <div id="coach-output" class="coach-output">Loading your learning plan…</div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/game.js') }}"></script>
</body>
</html>
